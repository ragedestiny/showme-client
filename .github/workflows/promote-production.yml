name: Promote to production

# Copies the version that is on the staging site (and that QA Wolf tested)
# to the live site. Run it from the Actions tab with "Run workflow".
#
# `main` is production: the live site is Netlify's build of `main`, so
# promoting means moving `main` to the tested commit from `staging`; Netlify
# then rebuilds the live site from it. Nothing is rebuilt from new code: it
# is the same commit. Nobody pushes to `main` by hand; only this workflow.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          Leave empty to promote what is on staging now. To roll back, enter an
          earlier commit SHA from the staging branch.
        required: false
        default: ""
      skip-qawolf-check:
        description: >-
          Emergency only: promote even without a passing "QA Wolf verdict"
          check (e.g. rolling back to a version from before QA Wolf ran).
        type: boolean
        required: false
        default: false

# Never two promotions at once
concurrency:
  group: promote-production
  cancel-in-progress: false

env:
  STAGING_URL: https://staging--show-me-not-tell.netlify.app
  PRODUCTION_URL: https://show-me-not-tell.netlify.app

jobs:
  promote:
    runs-on: ubuntu-24.04
    # The "production" environment (repo Settings > Environments) asks a
    # required reviewer to approve before this job starts
    environment: production
    permissions:
      contents: write # to move the main branch
      checks: read # to read the commit's "QA Wolf verdict" check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to check the commit came from staging

      - name: Choose the commit to promote
        id: pick
        env:
          REQUESTED: ${{ inputs.commit }}
        run: |
          if [ -n "$REQUESTED" ]; then
            sha=$(git rev-parse --verify "$REQUESTED^{commit}")
          else
            sha=$(curl -fsS "$STAGING_URL/version.txt")
          fi
          # Only code that has been merged to staging (and so was tested there)
          if ! git merge-base --is-ancestor "$sha" origin/staging; then
            echo "::error::$sha is not a commit on staging; refusing to promote it"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Promoting $sha: $(git log -1 --format=%s "$sha")"

      # The quality gate: QA Wolf must have passed this exact commit on staging
      # (the "QA Wolf verdict" check, from qawolf-staging.yml)
      - name: Check QA Wolf passed this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.pick.outputs.sha }}
          SKIP: ${{ inputs.skip-qawolf-check }}
        run: |
          url="repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=QA%20Wolf%20verdict"
          passed=$(gh api "$url" --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -gt 0 ]; then
            echo "QA Wolf passed $SHA on staging"
          elif [ "$SKIP" = "true" ]; then
            echo "::warning::Promoting $SHA WITHOUT a passing QA Wolf verdict (skip-qawolf-check was ticked)"
          else
            echo "::error::QA Wolf has not passed $SHA (no successful 'QA Wolf verdict' check). Refusing to promote."
            exit 1
          fi

      # --force so that rolling back to an older commit is possible
      - name: Move main (production) to that commit
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: git push --force origin "$SHA:refs/heads/main"

      - name: Wait for Netlify to publish it on the live site
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          for attempt in $(seq 1 60); do
            live=$(curl -fsS "$PRODUCTION_URL/version.txt?check=$attempt" || true)
            if [ "$live" = "$SHA" ]; then
              echo "The live site now serves $SHA"
              exit 0
            fi
            echo "Live site is not on $SHA yet, waiting..."
            sleep 10
          done
          echo "::error::The live site did not publish $SHA within 10 minutes"
          exit 1
