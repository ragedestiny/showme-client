<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/book-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Show, don't tell: turn plain sentences into vivid descriptions"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Both fonts in one request: the browser waits for this stylesheet
         before drawing the page -->
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,500;1,500&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap's styles come with the app's own stylesheet (imported in
         src/index.jsx), so no separate copy is loaded from a CDN -->
    <link rel="stylesheet" href="/styles.css" />
    <title>Show And Tell</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Vite starts building the app from here -->
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
